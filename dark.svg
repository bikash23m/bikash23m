<text x="530" y="130" class="mono key">name</text><text x="650" y="130" class="mono value">: BIKASH23M</text>
<text x="530" y="160" class="mono key">role</text><text x="650" y="160" class="mono value">: FULL STACK DEVELOPER</text>
<text x="530" y="190" class="mono key">focus</text><text x="650" y="190" class="mono value">: WEB • CLOUD • AI</text>
