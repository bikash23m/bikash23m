<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B1120"/>
    <stop offset="100%" stop-color="#050816"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
    <stop offset="48%" stop-color="#22D3EE" stop-opacity="0.04"/>
    <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.5"/>
    <stop offset="52%" stop-color="#22D3EE" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
  <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#22D3EE" opacity="0.035"/>
  </pattern>
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .small { font-size: 11px; fill: #64748B; letter-spacing: 2px; }
    .key { font-size: 15px; fill: #22D3EE; font-weight: bold; }
    .value { font-size: 15px; fill: #E5E7EB; }
    .head { font-size: 18px; fill: #7C3AED; font-weight: bold; }
  </style>
</defs>

<rect width="1180" height="610" rx="18" fill="url(#bg)"/>
<rect width="1180" height="610" rx="18" fill="url(#lines)"/>

<!-- terminal bar -->
<rect x="3" y="3" width="1174" height="36" rx="16" fill="#0B1120" fill-opacity="0.34"/>
<circle cx="25" cy="21" r="5" fill="#F87171"/>
<circle cx="43" cy="21" r="5" fill="#F59E0B"/>
<circle cx="61" cy="21" r="5" fill="#10B981"/>
<text x="590" y="26" text-anchor="middle" class="mono" font-size="12" fill="#64748B">bikash@devos ~ % ./profile.sh --live</text>
<circle cx="1118" cy="21" r="4" fill="#F87171">
  <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
</circle>
<text x="1130" y="25" class="mono" font-size="10" fill="#F87171" letter-spacing="1">ONLINE</text>

<!-- panels -->
<rect x="14" y="64" width="470" height="500" rx="14" fill="#0B1120" fill-opacity="0.34" stroke="url(#accent)" opacity=".55"/>
<rect x="502" y="64" width="664" height="500" rx="14" fill="#0B1120" fill-opacity="0.34" stroke="url(#accent)" opacity=".55"/>

<text x="30" y="91" class="mono small">VISUAL.MAP</text>
<text x="520" y="91" class="mono small">SYSTEM.INFO</text>

